[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-factor-engine"
version = "0.1.0"
description = "Point-in-time stock selection and backtesting engine for explainable factor strategies."
requires-python = ">=3.12"
dependencies = ["tzdata>=2025.1"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
